name: Auto-Sync GitHub Profile (Avatar & Projects)

on:
  schedule:
    # Run automatically every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows 1-click instant manual sync anytime

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install Pillow requests

      - name: Fetch live repositories & refresh assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD_AVATAR: "1"
        run: |
          python generate_profile_assets.py --refresh-all

      - name: Commit and push changes if profile updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add avatar.png terminal-card.svg info-card.svg README.md repos_cache.json
          if git diff --staged --quiet; then
            echo "No profile or project changes detected."
          else
            git commit -m "chore(sync): auto-sync latest projects and assets from GitHub"
            git push origin main
          fi
